name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The engine, protocol, daemon and bar client have no graphical dependencies at
  # all, which is the point of keeping waytify-core free of GTK. They are checked
  # on their own so a missing system library can never be the reason the core
  # looks broken.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude waytify-popup --all-targets

      # The end-to-end tests serve a mock MPRIS player on a session bus and skip
      # when there is none, so without this they would pass having tested nothing.
      - name: Install dbus
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Test
        run: |
          dbus-run-session -- cargo test --workspace --exclude waytify-popup

      - name: Build without the window
        run: cargo build --package waytify --no-default-features

  # The window is built separately because it needs GTK4 and gtk4-layer-shell.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4 and layer shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtk4-layer-shell-dev

      - name: Clippy
        run: cargo clippy --package waytify-popup --all-targets

      - name: Build
        run: cargo build --package waytify

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the core on the minimum supported Rust version
        run: cargo build --workspace --exclude waytify-popup
