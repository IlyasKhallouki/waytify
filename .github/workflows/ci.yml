name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The engine, protocol, daemon and bar client have no graphical dependencies at
  # all, which is the point of keeping waytify-core free of GTK. They are checked
  # on their own so a missing system library can never be the reason the core
  # looks broken.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p waytify-ipc -p waytify-core -p waytify-daemon -p waytify-bar --all-targets

      # The end-to-end tests serve a mock MPRIS player on a session bus and skip
      # when there is none, so without this they would pass having tested nothing.
      # dbus so the end-to-end tests have a session bus to serve the mock player
      # on, and libpulse because volume control links against it.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y dbus libdbus-1-dev libpulse-dev

      - name: Test
        run: |
          dbus-run-session -- cargo test -p waytify-ipc -p waytify-core -p waytify-daemon -p waytify-bar

      - name: Build without the window
        run: cargo build --package waytify --no-default-features

  # The window is built separately because it needs GTK4 and gtk4-layer-shell.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libdbus-1-dev libpulse-dev meson ninja-build \
            libgirepository1.0-dev gobject-introspection

      # Ubuntu does not package gtk4-layer-shell, and dropping this job to work
      # around that would leave the window with no CI at all. Building it takes
      # about a minute. Pinned to the version developed against rather than
      # tracking a branch.
      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Clippy
        run: cargo clippy --package waytify-popup --all-targets

      - name: Build
        run: cargo build --package waytify

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpulse-dev
      - name: Build the core on the minimum supported Rust version
        run: cargo build -p waytify-ipc -p waytify-core -p waytify-daemon -p waytify-bar
