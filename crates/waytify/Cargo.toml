[package]
name = "waytify"
description = "Media control for Waybar: MPRIS core, optional Spotify enrichment, GTK4 popup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "waytify"
path = "src/main.rs"

[features]
default = ["popup"]
# The window pulls in GTK4. Turning it off gives a bar-and-daemon build with no
# graphical dependencies, which is what a headless or minimal install wants.
popup = ["dep:waytify-popup"]

[dependencies]
waytify-bar = { workspace = true }
waytify-core = { workspace = true }
waytify-daemon = { workspace = true }
waytify-ipc = { workspace = true }
waytify-popup = { workspace = true, optional = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
