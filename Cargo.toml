[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Ilyas Khallouki <khalloukielias@gmail.com>"]
repository = "https://github.com/IlyasKhallouki/waytify"
homepage = "https://github.com/IlyasKhallouki/waytify"
keywords = ["waybar", "mpris", "spotify", "wayland", "hyprland"]
categories = ["command-line-utilities", "multimedia"]

[workspace.dependencies]
waytify-ipc = { path = "crates/waytify-ipc", version = "0.1.0" }
waytify-core = { path = "crates/waytify-core", version = "0.1.0" }
waytify-daemon = { path = "crates/waytify-daemon", version = "0.1.0" }
waytify-bar = { path = "crates/waytify-bar", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "process",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
