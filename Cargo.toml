[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# gtk4 0.11 requires 1.92, so that is the real floor for a default build.
rust-version = "1.92"
license = "MIT"
authors = ["Ilyas Khallouki <khalloukielias@gmail.com>"]
repository = "https://github.com/IlyasKhallouki/waytify"
homepage = "https://github.com/IlyasKhallouki/waytify"
keywords = ["waybar", "mpris", "spotify", "wayland", "hyprland"]
categories = ["command-line-utilities", "multimedia"]

[workspace.dependencies]
waytify-ipc = { path = "crates/waytify-ipc", version = "0.1.0" }
waytify-core = { path = "crates/waytify-core", version = "0.1.0" }
waytify-daemon = { path = "crates/waytify-daemon", version = "0.1.0" }
waytify-bar = { path = "crates/waytify-bar", version = "0.1.0" }
waytify-popup = { path = "crates/waytify-popup", version = "0.1.0" }

anyhow = "1"
async-channel = "2"
# v4_12 for CssProvider::load_from_string, which is what makes replacing a
# provider's contents on hot reload straightforward. GTK 4.12 is from 2023.
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
# Only the formats album art actually arrives in, to keep build time and binary
# size off the floor.
libpulse-binding = "2.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify = "8"
# rustls rather than native-tls so there is no OpenSSL build dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "fs",
  "sync",
  "time",
  "signal",
  "process",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
